[pytest]
testpaths = tests
# Temporary files stay inside the repository (git-ignored): nothing is written outside it.
addopts = --basetemp=.pytest_tmp -p no:cacheprovider
markers =
    real_shared_state: the test builds its own scratch repositories, so profiles.shared_state_dir really asks git (MW-017)
    engine_repo: needs the engine repository itself (its register, git-tracked files, its working tree as an install source); mkway check leaves it out in a task's copy
