[pytest]
testpaths = tests
# Temporary files stay inside the repository (git-ignored): nothing is written outside it.
addopts = --basetemp=.pytest_tmp -p no:cacheprovider -m "not perf"
markers =
    real_shared_state: the test builds its own scratch git repositories, linked worktrees included (MW-017, MW-026)
    e2e: the contract with Claude Code, through the real hook command or a replay of the real shape (test_e2e*.py, test_mw030*, test_mw038*); merge and release run it, the default run excludes nothing yet (MW-052)
    shell: reads facts from real git on prepared repositories, 20 s per test (tests/shell, MW-052)
    engine_repo: needs the engine repository itself (its register, git-tracked files, its working tree as an install source); mkway check leaves it out in a task's copy
    perf: a wall-clock check, not a correctness test; kept out of commit and merge runs, run alone before a release tag (R172)
